name: Build Play Studio Lightweight Web Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-studio-web-installer-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build lightweight installer without publishing
        run: npm run dist:web:test

      - name: Verify web installer outputs
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe -File
          $payload = Get-ChildItem release -Filter *.7z -File
          if (-not $exe) { throw "No se genero el instalador web .exe" }
          if (-not $payload) { throw "No se genero el paquete descargable .7z" }
          Get-ChildItem release -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload verified web installer test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Play-Studio-Lightweight-Web-Installer-Test
          path: |
            release/*.exe
            release/*.7z
            release/*.yml
          if-no-files-found: error
          retention-days: 14
